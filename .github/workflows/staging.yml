name: Déploiement Staging

on:
  push:
    branches:
      - develop
      - feature/*
  pull_request:
    branches:
      - develop

# Définition des permissions nécessaires
permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '21'
          cache: 'npm'
          
      - name: Installation des dépendances
        run: npm ci
        
      - name: Exécution des tests
        run: npm test

  deploy-staging:
    name: Déploiement Staging
    needs: test
    runs-on: self-hosted
    environment:
      name: staging
      url: http://staging.votreapp.com
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '21'
          cache: 'npm'
          
      - name: Installation des dépendances
        run: npm ci
        
      - name: Construction et déploiement
        run: |
          chmod +x ./deploy-staging.sh
          ./deploy-staging.sh
        env:
          DOCKER_BUILDKIT: 1
          
      - name: Créer un statut de déploiement
        if: success()
        run: |
          echo "✅ Déploiement en staging réussi !"
          echo "🌐 Application accessible sur http://staging.votreapp.com"
          echo "📦 Version déployée : ${GITHUB_SHA::7}"
